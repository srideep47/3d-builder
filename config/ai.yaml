# 3D Builder AI Provider Configuration
provider: "aptos"
base_url: "https://host0.inference.aptoslabs.com/v1"
model_id: "zai-org/GLM-5.3"
api_key_env: THREED_API_KEY
timeout_sec: 300
temperature: 0.1
max_tokens: 16384

# GLM-5.3 is a reasoning model. "low" reasoning_effort cuts analyst/corrector
# latency from ~90-180s to ~6s with equal spec quality (verified live); the
# verification loop catches quality drift. Set to null/medium/high for deeper
# reasoning at ~30x the latency, and keep max_tokens generous either way —
# reasoning tokens are spent before content.
reasoning_effort: "low"

roles:
  analyst:
    max_tokens: 16384
    temperature: 0.1
  builder:
    max_tokens: 16384
    temperature: 0.1
  verifier:
    max_tokens: 8192
    temperature: 0.1

agent:
  max_iterations: 5
  wall_clock_budget_s: 900
  tool_choice: "auto"
  fallback_json_protocol: true

# Vision ladder (PROJECT_PLAN §7/§13.1):
#   1. mode "auto" probes the GLM-5.3 endpoint (deployed model is text-only —
#      verified: HTTP 400 "not a multimodal model").
#   2. A local VLM (owner-built Qwen2.5-VL, OpenAI-compatible, e.g. vLLM on
#      the 4080 Super) fills both remaining roles when configured below:
#        - analyst eye: describes reference images for the text-only analyst
#        - visual gate: advisory render-vs-reference verdict in the manifest
#      Serve it, then set vision.vlm.base_url + model — the health dot in the
#      web UI turns green and both integrations activate automatically.
#   3. Nothing configured: text-description mode (measurements still enforce
#      accuracy).
vision:
  mode: auto
  vlm:
    # Gemini is the active eye on Scout (4 GB VRAM fits no local model;
    # HANDOFF_GLM §3 — switch the gate on and use it as the feedback loop).
    # The local Qwen-VL path stays available for Forge: flip provider back
    # to "local" and set base_url + model there.
    provider: gemini  # local (OpenAI-compatible vLLM/Qwen-VL) | gemini (Google v1beta)
    base_url: null   # local: e.g. http://127.0.0.1:8001/v1 (includes /v1);
                     # gemini: host root, default https://generativelanguage.googleapis.com
    model: gemini-3.6-flash  # local: e.g. Qwen/Qwen2.5-VL-7B-Instruct
                     # gemini: PINNED version only (-latest is rejected)
    api_key_env: THREED_VLM_API_KEY  # key comes from the ENV only, never this file;
                     # gemini also falls back to GEMINI_API_KEY (same value)
    timeout_sec: 120
