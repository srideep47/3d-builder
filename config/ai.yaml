# 3D Builder AI Provider Configuration
provider: "aptos"
base_url: "https://host0.inference.aptoslabs.com/v1"
model_id: "zai-org/GLM-5.3"
api_key_env: THREED_API_KEY
timeout_sec: 300
temperature: 0.1
max_tokens: 16384

# GLM-5.3 is a reasoning model. "low" reasoning_effort cuts analyst/corrector
# latency from ~90-180s to ~6s with equal spec quality (verified live); the
# verification loop catches quality drift. Set to null/medium/high for deeper
# reasoning at ~30x the latency, and keep max_tokens generous either way —
# reasoning tokens are spent before content.
reasoning_effort: "low"

roles:
  analyst:
    max_tokens: 16384
    temperature: 0.1
  builder:
    max_tokens: 16384
    temperature: 0.1
  verifier:
    max_tokens: 8192
    temperature: 0.1

agent:
  max_iterations: 5
  wall_clock_budget_s: 900
  tool_choice: "auto"
  fallback_json_protocol: true

# Vision: the deployed GLM-5.3 is NOT multimodal (verified: HTTP 400
# "zai-org/GLM-5.3 is not a multimodal model"). "auto" probes and falls back to
# text-description mode; a local VLM on PC 1 can be wired in later.
vision: auto
