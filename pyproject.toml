[project]
name = "threed-builder"
version = "0.1.0"
description = "AI 3D Model Generation from Reference Images + Measurements"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5",
    "openai>=1.20",
    "mcp[cli]>=1.0.0",
    "typer>=0.12",
    "trimesh>=4.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "rich>=13.7",
    "scipy>=1.11",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["blender: tests that require a local Blender installation"]

[tool.uv]
package = false
