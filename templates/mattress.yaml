# templates/mattress.yaml — the ONLY place mattress knowledge lives
# (GLM_BRIEF rule 11). Compiled by src/spec/template.py:compile_spec with a
# job card's owner-supplied dimensions. Everything below is PROPORTIONS —
# no absolute size exists here, and none may ever be added (rule 9: the
# owner supplies dimensions; a standard queen size must never be inferred).
#
# Structure and wording track the §5.2 written transcription of the
# reference photos (CORRECTED round 3, reviewer's eyes — ten bands):
#   1 pillowtop crown (domed, puffed quilt panel, white knit + faint grey
#     chevron micro-print)          -> band `crown` + real quilt geometry
#   2 tape edge (top perimeter)     -> tape below crown
#   3 air-mesh band (white 3D spacer mesh, tallest light band)
#                                   -> band `air_mesh`
#   4 tape edge (mid)               -> tape below air_mesh
#   5 border stack: white knit rib, then velvet, rib, velvet, rib, velvet
#     (the rib comes FIRST below the air-mesh — round-3 correction)
#                                   -> bands knit_1..3, velvet_1..3
#   6 white band (plain, above the base — round-3 correction)
#                                   -> band `white_band`
#   7 tape edge (bottom perimeter)  -> tape below white_band
#   8 base (dark, rarely visible, cheap)
#
# Band proportions are a FIRST PASS from the §5.2 reading ("air-mesh is
# roughly the tallest single light band"; velvet bands slightly taller
# than the knit ribs). They are owner-tunable numbers — review the
# rendered output against the reference before delivery and adjust.
product_class: mattress
description: >
  Pillowtop hybrid mattress: domed quilted crown over a straight-sided
  banded border with perimeter tape edges and a side brand label
  (GLM_BRIEF §5.2). Model the mattress only — no frame, pillows, or
  bedding (§5.1); internal marketing layers are NOT modelled (§5.4).

footprint:
  exponent: 5.0        # superellipse: 2=ellipse, 5=rounded rectangle
  segments: 48

bands:                 # top to bottom; height_fractions MUST sum to 1.0
  - name: crown
    height_fraction: 0.28
    material: knit_white
  - name: air_mesh
    height_fraction: 0.162
    material: mesh_white
  - name: knit_1
    height_fraction: 0.062
    material: knit_white
  - name: velvet_1
    height_fraction: 0.072
    material: velvet_charcoal
  - name: knit_2
    height_fraction: 0.062
    material: knit_white
  - name: velvet_2
    height_fraction: 0.072
    material: velvet_charcoal
  - name: knit_3
    height_fraction: 0.062
    material: knit_white
  - name: velvet_3
    height_fraction: 0.072
    material: velvet_charcoal
  - name: white_band
    height_fraction: 0.056
    material: plain_white
  - name: base
    height_fraction: 0.10
    material: base_dark

crown:
  profile_exponent: 3.5   # z(s)=H(1-s^Q)^(1/Q): ~3.5 = pillow-like roll-off
  quilt:                  # REAL LP geometry (round 3, reviewer's eyes): the
                          # puffs break the top silhouette in the photos —
                          # a baked normal map cannot do that. Grid cap
                          # FG-mapped onto the footprint; stitch valleys on
                          # grid lines; peaks land on the nominal band top.
    pattern: grid_square # straight rows/columns (§5.2 band 1, CORRECTED
                          # round 3: product photos read SQUARE grid; the
                          # marketing render shows diamond — see §5.2 note)
    cells_across: 17     # ~119mm cells on a queen; reference shows 12-14
                          # cells across the WIDTH -> 13 cross-cells derived
    amplitude_fraction: 0.12  # of one CELL — ~14.3mm puffs on a queen
                              # (0.15/17.8mm read as sharp exaggerated
                              # zigzag in the round-3 Group-A render check)
    exponent: 1.3         # round domes, soft-edged puffs, not boxy peaks
    divisions: 4          # grid samples per cell
    restrict_z: 0.85      # displace only near-flat verts: the steep
                          # shoulder stays on the footprint (bounds contract)

tape_edges:            # thin binding tape (§5.2): flush-seated sweeps on the
                       # inset band wall, one protrusion proud; the outer
                       # face lands exactly on the nominal L/W silhouette.
                       # Fractions of min(L, W, H) — cross-section scale,
                       # NOT of H (H-based fractions made 74 mm collars on
                       # the tall placeholder build).
  # Round 3 (reviewer's eyes): the tape reads as a ROUNDED CORD ~2-3% of
  # H, not a thin flat strip. width == protrusion makes _build_sweep use a
  # circular section (a cord ~7mm across on a 12in-tall queen); the path
  # offset of half a protrusion puts the cord's inner tangent on the wall
  # and outer tangent exactly on the nominal silhouette.
  - at_boundary_below: crown
    width_fraction: 0.023        # cord diameter (== protrusion: round)
    protrusion_fraction: 0.023
    material: tape_black
  - at_boundary_below: air_mesh
    width_fraction: 0.023
    protrusion_fraction: 0.023
    material: tape_black
  - at_boundary_below: white_band
    width_fraction: 0.023
    protrusion_fraction: 0.023
    material: tape_black

decal:                 # brand label (§5.3): front-left side border, portrait
                       # Round-3 correction (reviewer's eyes): TALLER and
                       # NARROWER — spans nearly the whole velvet stack.
                       # Measured off the corner close-up: aspect ~0.45,
                       # ~74% of the tape-to-tape border stack height.
  face: front
  along_fraction: -0.35     # left of face centre as seen from the front
  center_height_fraction: 0.33    # centred on the velvet/rib border stack
  aspect: 0.46              # patch width / height (portrait; the albedo crop
                            # is 0.5 — the 8% squeeze is imperceptible)
  height_fraction: 0.34     # of H; spans z 0.16..0.50 — inside the velvet
                            # stack (0.156..0.558), clears tape_3 (0.10) and
                            # tape_2 (0.558)
  texture: input/decals/MAYA00053153   # dir with albedo.png (photo crop)

textures:
  knit_white:
    base: scan
    scan: knitted_fleece             # CC0 (Poly Haven), structure only
    tint: [0.93, 0.92, 0.89]         # cream-white knit (§5.2 band 1)
    tile_m: 2.68                     # scan physical size (SOURCE.json)
    resolution: 2048
    roughness: 0.82
    bump_strength: 0.12
    layers:
      - kind: chevron               # faint grey zigzag micro-print (§5.2 band 1)
        params: {pitch_m: 0.08, thickness_m: 0.004, amplitude_m: 0.08}
        color: [0.66, 0.66, 0.68]
        opacity: 0.16
        height_delta: -0.02
        roughness_delta: 0.03

  mesh_white:
    base: flat
    tint: [0.90, 0.90, 0.89]         # white spacer mesh (§5.2 band 3)
    tile_m: 0.30
    resolution: 1024
    roughness: 0.85
    bump_strength: 0.35              # distinctly open and textural
    layers:
      - kind: oval_holes             # perforated honeycomb/oval holes
        params: {cell_m: 0.010, hole_rx: 0.30, hole_ry: 0.20}
        color: [0.55, 0.56, 0.58]    # holes read darker/greyer
        opacity: 0.55
        height_delta: -0.30          # recessed holes
        roughness_delta: 0.10

  velvet_charcoal:
    base: scan
    scan: velour_velvet              # CC0 (Poly Haven), napped structure
    tint: [0.09, 0.09, 0.10]         # near-black charcoal (§5.2 band 5,
                                      # round-3: 0.16 read too light — the
                                      # reference velvet is ~8-10% lightness)
    rotate_deg: 90                   # the scan's nap streaks run horizontal
                                      # in texture space; quarter-turn so the
                                      # VERTICAL nap streaks render on walls
    tile_m: 2.79                     # scan physical size (SOURCE.json)
    resolution: 2048
    roughness: 0.50                  # sheen: catches light along the length
    bump_strength: 0.10

  tape_black:
    base: flat
    tint: [0.05, 0.05, 0.05]         # black/near-black binding (§5.2 bands 2/4/6)
    tile_m: 0.05
    resolution: 1024
    roughness: 0.62
    bump_strength: 0.30
    layers:
      - kind: herringbone            # diagonal twill weave, visible at zoom
        params:
          column_width_m: 0.003
          stripe_pitch_m: 0.0025
          stripe_fraction: 0.5
          groove_width: 0.12
          groove_height_delta: -0.10
          groove_roughness_delta: 0.05
        color: [0.16, 0.16, 0.16]    # slightly lighter yarn over near-black
        opacity: 0.45
        height_delta: 0.12
        roughness_delta: -0.05

  plain_white:
    base: flat
    tint: [0.88, 0.88, 0.87]         # plain white band above the base (§5.2
                                      # band 9, round-3 correction — smooth,
                                      # not the ribbed knit)
    tile_m: 0.30
    resolution: 1024
    roughness: 0.72

  base_dark:
    base: flat
    tint: [0.10, 0.10, 0.10]         # dark non-slip underside (§5.2 band 7)
    roughness: 0.9

features:
  carry_handles:
    enabled: true            # reviewer round-3 correction (photo 9.28.35):
                             # the handles EXIST — §9.4 open question CLOSED.
                             # Vertical dark straps crossing the full border
                             # stack, two per long side at the quarter points.
    count_per_side: 2
    width_fraction: 0.08     # ~24mm webbing on a queen (of min(L,W,H))
    protrusion_fraction: 0.92  # of the tape protrusion — outer face just
                             # behind the tape plane (no z-fighting where
                             # the straps cross the tapes)
    from_boundary: white_band  # strap bottom at the bottom tape line
    to_boundary: crown         # strap top at the top tape line (full stack)
    material: tape_black

tri_budget: 50000     # Simple tier provisional ceiling (open question §9.2)
